<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salt Muse | The Summer Vault Waitlist</title>
    <!-- Google Fonts for elegant serif typography matching the brand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* 1. BRAND COLOR PALETTE CONFIGURATION */
        :root {
            --brand-pink: #FCE2E6;        /* Soft pastel pink background */
            --brand-teal: #3D7475;        /* Deep ocean teal text */
            --brand-teal-dark: #2A5354;   /* Darker teal for interaction states */
            --brand-gold: #C5A059;        /* Warm metallic gold accent */
            --brand-gold-gradient: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
            --bg-card: #FAF8F5;           /* Off-white cream surface color */
            --text-muted: #5C6767;        /* Secondary supporting text color */
        }

        /* 2. BASE RESET & LAYOUT */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--brand-pink);
            color: var(--text-muted);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle ambient decorative lighting */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
            top: -10%;
            right: -10%;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            margin-top: 40px; /* Space for the floating badge */
        }

        /* 3. FLOATING SPOTS REMAINING BADGE */
        .spots-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--brand-gold-gradient);
            color: #FFFFFF;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            width: fit-content;
            margin: 0 auto 2rem auto;
            box-shadow: 0 4px 15px rgba(170, 124, 17, 0.2);
        }

        .spots-badge .pill {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 0.1rem 0.6rem;
            border-radius: 9999px;
            margin-left: 0.5rem;
            font-size: 0.8rem;
        }

        /* 4. HERO WAITLIST CONTAINER */
        .waitlist-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(197, 160, 89, 0.3); /* Subtle gold frame border */
            border-radius: 16px;
            padding: 3.5rem 2.5rem 2.5rem 2.5rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(61, 116, 117, 0.08);
            position: relative;
        }

        /* 5. BRAND LOGO ACCENT PLACEHOLDER */
        .logo-placeholder {
            width: 110px;
            height: 110px;
            background-color: #FFFFFF;
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 50%;
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            font-size: 0.75rem;
            color: var(--brand-teal);
            font-weight: 600;
            overflow: hidden;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 6. TYPOGRAPHY */
        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--brand-teal);
            font-size: 2.5rem;
            font-weight: 500;
            line-height: 1.25;
            margin-bottom: 1.25rem;
        }

        p.description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-muted);
            max-width: 520px;
            margin: 0 auto 2.5rem auto;
        }

        /* 7. WAITLIST SIGNUP FORM */
        .form-container {
            max-width: 540px;
            margin: 0 auto;
        }

        .signup-form {
            display: flex;
            gap: 12px;
            margin-bottom: 1.25rem;
        }

        .input-group {
            flex: 1;
            position: relative;
        }

        .signup-form input[type="email"] {
            width: 100%;
            padding: 1.1rem 1.25rem;
            border: 1px solid rgba(197, 160, 89, 0.5);
            background-color: #FFFFFF;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--brand-teal);
            transition: all 0.3s ease;
            outline: none;
        }

        .signup-form input[type="email"]:focus {
            border-color: var(--brand-teal);
            box-shadow: 0 0 0 3px rgba(61, 116, 117, 0.1);
        }

        .signup-form input[type="email"]::placeholder {
            color: #A3B1B1;
        }

        .btn-submit {
            background: var(--brand-gold-gradient);
            color: #FFFFFF;
            border: none;
            padding: 0 2rem;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(170, 124, 17, 0.15);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(170, 124, 17, 0.25);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* 8. FOOTER NOTES */
        .footer-note {
            font-size: 0.8rem;
            color: #8A9797;
        }

        .footer-note a {
            color: var(--brand-teal);
            text-decoration: underline;
            transition: color 0.2s;
        }

        .footer-note a:hover {
            color: var(--brand-teal-dark);
        }

        /* Decorative celestial star element */
        .star-decorator {
            margin-top: 2rem;
            color: var(--brand-gold);
            font-size: 1.25rem;
            opacity: 0.7;
        }

        /* Responsive adaptations */
        @media (max-width: 580px) {
            .waitlist-card {
                padding: 3.5rem 1.5rem 2rem 1.5rem;
            }
            h1 {
                font-size: 1.9rem;
            }
            .signup-form {
                flex-direction: column;
            }
            .btn-submit {
                padding: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <!-- Live Spot Banner Counter -->
        <div class="spots-badge">
            <span>92 Spots Available</span>
            <span class="pill">100 Max</span>
        </div>

        <div class="waitlist-card">
            <!-- Brand Identity Placement -->
            <div class="logo-placeholder">
                <!-- Points to your auto-formatted mobile device upload name -->
                <img src="Image.png.PNG" alt="Salt Muse Logo">
            </div>

            <!-- Waitlist Messaging -->
            <h1>The Summer Vault:<br>Exclusive Access is Coming.</h1>
            <p class="description">
                Enter your email to join the Salt Muse inner circle. Be first to access our curated collection of eternal summer essentials. Spots are strictly limited.
            </p>

            <!-- Waitlist Capture Interface -->
            <div class="form-container">
                <form class="signup-form" action="https://api.web3forms.com/submit" method="POST" id="waitlistForm">
                    
                    <!-- INSERT ACCESS KEY BELOW -->
                    <input type="hidden" name="access_key" value="">
                    
                    <!-- Anti-spam honeypot field for bots -->
                    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                    <div class="input-group">
                        <input type="email" name="email" placeholder="Enter your email for priority access..." required aria-label="Email address">
                    </div>
                    <button type="submit" class="btn-submit">JOIN THE WAITLIST</button>
                </form>
                
                <div class="footer-note">
                    By joining, you agree to our <a href="#">privacy policy</a>.
                </div>
            </div>

            <!-- Visual branding star element matching logo detail -->
            <div class="star-decorator">✦</div>
        </div>
    </div>

    <script>
        // Smooth background handling for user signups
        const form = document.getElementById("waitlistForm");
        
        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            const data = new FormData(event.target);
            const submitButton = form.querySelector('.btn-submit');
            
            submitButton.textContent = "JOINING...";
            submitButton.disabled = true;

            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: data,
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (response.ok) {
                    alert("Thank you! You have been securely added to the Salt Muse exclusive priority queue.");
                    form.reset();
                } else {
                    alert("Oops! There was a problem submitting your entry. Please try again.");
                }
            } catch (error) {
                alert("Oops! There was a connectivity issue. Please try again.");
            } finally {
                submitButton.textContent = "JOIN THE WAITLIST";
                submitButton.disabled = false;
            }
        });
    </script>

</body>
</html>
